{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">
  <h1 class="h3 text-center text-gradient mb-4">Админ-панель</h1>
  <div class="card card-glass p-4 rounded-4">
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% for err in field_errors.get('login', []) %}
      <div class="alert alert-danger py-2">{{ err }}</div>
      {% endfor %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" class="form-control" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" name="remember" id="id_remember" class="form-check-input" value="on">
        <label class="form-check-label" for="id_remember">Запомнить меня</label>
      </div>
      <button type="submit" class="btn btn-accent w-100">Войти</button>
    </form>
  </div>
  <p class="text-center mt-3"><a href="{{ url_for('index') }}" class="text-muted">На главную</a></p>
</div>
{% endblock %}
